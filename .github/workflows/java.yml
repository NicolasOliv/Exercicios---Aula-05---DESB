name: Java CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Compilar cada pasta de exercicios
        run: |
          set -e
          find . -type f -name "*.java" -printf '%h\n' | sort -u | while read -r dir; do
            echo "== Compilando $dir =="
            javac "$dir"/*.java
          done
